name: Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    # One job per Python version; each runs the tests against every Django
    # release that supports that Python version (see envlist in tox.ini).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install tox
        run: pip install tox
      - name: Run tests on every supported Django version
        env:
          PY: ${{ matrix.python }}
        run: tox run -f "py${PY//./}"

  package:
    # Build the sdist and wheel the same way the release workflow does, and validate them.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check, build and validate the package
        run: |
          python -m pip install --upgrade pip build check-manifest twine
          check-manifest
          python -m build
          twine check --strict dist/*
