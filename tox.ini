[tox]
# Every Django release the package supports (django>=4.0), each with the
# Python versions that Django release supports.
envlist =
    py{38,39,310}-django40
    py{38,39,310,311}-django41
    py{38,39,310,311,312}-django42
    py{310,311,312}-django50
    py{310,311,312,313}-django51
    py{310,311,312,313,314}-django52
    py{312,313,314}-django{60,61}
minversion = 4.0

[testenv]
deps =
    pytest
    django40: Django>=4.0,<4.1
    django41: Django>=4.1,<4.2
    django42: Django>=4.2,<5.0
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2
commands =
    pytest tests {posargs}

[testenv:package]
# Same checks as the "package" CI job: sdist contents, build, metadata.
skip_install = true
deps =
    build
    check-manifest >= 0.42
    twine
commands =
    check-manifest
    python -m build --outdir {envtmpdir}/dist
    twine check --strict {envtmpdir}/dist/*
